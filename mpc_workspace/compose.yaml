services:
  mpc:
    image: mpc-workspace:humble
    build:
      context: .
      args:
        BUILD_WORKSPACE: ${BUILD_WORKSPACE:-false}
        BUILD_JOBS: ${BUILD_JOBS:-4}
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    volumes:
      - ./src:/host_src:ro
    working_dir: /mpc_workspace
