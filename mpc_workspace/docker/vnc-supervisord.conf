[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1600x900x24 -ac -nolisten tcp
priority=10
autorestart=true

[program:desktop]
command=/usr/bin/openbox
priority=20
autorestart=true

[program:vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900
priority=30
autorestart=true

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc/ 127.0.0.1:6080 127.0.0.1:5900
priority=40
autorestart=true

[program:gazebo]
command=/bin/bash -c "source /opt/ros/humble/setup.bash && ros2 launch gazebo_ros gazebo.launch.py"
priority=50
autorestart=unexpected
startsecs=10
stdout_logfile=/tmp/gazebo.log
stderr_logfile=/tmp/gazebo-error.log
