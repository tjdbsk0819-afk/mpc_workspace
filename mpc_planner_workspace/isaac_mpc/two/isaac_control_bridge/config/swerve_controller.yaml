controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 50

    antbot_swerve_controller:
      type: antbot_swerve_controller/SwerveDriveController

antbot_swerve_controller:
  ros__parameters:
    use_sim_time: true
    cmd_vel_topic: /cmd_vel
    cmd_vel_timeout: 0.5
    use_stamped_cmd_vel: false

    steering_joint_names:
      - steering_front_left_joint
      - steering_front_right_joint
      - steering_rear_left_joint
      - steering_rear_right_joint
    wheel_joint_names:
      - wheel_front_left_joint
      - wheel_front_right_joint
      - wheel_rear_left_joint
      - wheel_rear_right_joint

    wheel_radius: 0.103
    module_x_offsets: [0.265, 0.265, -0.265, -0.265]
    module_y_offsets: [0.256, -0.256, 0.256, -0.256]
    module_angle_offsets: [0.0, 0.0, 0.0, 0.0]
    module_steering_limit_lower: [-0.959, -0.959, -0.959, -0.959]
    module_steering_limit_upper: [0.959, 0.959, 0.959, 0.959]
    steering_to_wheel_y_offsets: [0.0555, -0.0555, 0.0555, -0.0555]
    module_wheel_speed_limit_lower: [-50.0, -50.0, -50.0, -50.0]
    module_wheel_speed_limit_upper: [50.0, 50.0, 50.0, 50.0]

    steering:
      use_velocity_command: false
      use_acceleration_command: false
      max_velocity: 5.0
      max_acceleration: 10.0

    wheel:
      use_acceleration_command: false

    enable_direct_joint_commands: false
    enable_odom_tf: false
    enabled_wheel_saturation_scaling: true
    velocity_deadband: 0.01
    trajectory_delay_time: 0.0
    steering_target_margin: 0.02
    use_applied_feedback: true
    profile_error_duration: 0.12
    profile_stopped_duration: 0.10
    profile_stopped_wheel_speed: 0.15
    profile_feedback_timeout: 0.5
    # Reanchor a continuous profile if measured joints cannot follow it.
    profile_steering_error_limit: 0.35       # rad
    profile_wheel_velocity_error_limit: 1.0 # rad/s
