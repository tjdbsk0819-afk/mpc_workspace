[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antbot-dmpc"
version = "0.1.0"
description = "Legacy AntBot MPC reference used by the Isaac project scenarios and comparison tools"
requires-python = ">=3.10"
dependencies = ["casadi==3.7.0", "numpy>=1.26", "matplotlib>=3.7"]

[project.scripts]
antbot-mpc-sim = "legacy_mpc_reference.simulate:main"

[tool.setuptools.packages.find]
include = ["legacy_mpc_reference*", "simulation*"]
