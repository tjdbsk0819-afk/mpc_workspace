/**:
  ros__parameters:
    use_sim_time: true
    horizon: 10
    dt: 0.2
    control_frequency: 10.0
    state_timeout: 0.35
    plan_timeout: 0.35
    plan_timeout_enabled: false
    max_speed: 1.5
    max_acceleration: 0.7
    max_yaw_rate: 0.8
    max_yaw_acceleration: 0.5
    current_clearance_check_enabled: false
    separation: 1.15
    tracking_margin: 0.05
    # Extra planner-only inset for the executor's inter-sample wall guard.
    wall_planning_margin: 0.001
    # Three local IPOPT problems: adaptive barrier reduces cold-start iterations.
    # Equations/constraints are unchanged; time limits are disabled for measurement.
    ipopt_mu_strategy: adaptive
    solve_seconds: 0.0  # No IPOPT CPU/wall-clock time limit
    goal_tolerance: 0.2
    # Measured deceleration is slower than the model acceleration limit when the
    # receding velocity profile is followed by RPP/Swerve. Brake in advance.
    goal_braking_deceleration: 0.25
    goal_reaction_time: 0.3
    goal_stop_reserve: 0.08
    # Same planar prediction as mpc_planner (including observation age):
    # mean=p+v*t, sigma=noise*sqrt(dt*t), radius=sqrt(-2*log(risk))*sigma.
    # Every peer constraint includes this radius; it is not a display-only ring.
    peer_prediction_model: cv_gaussian
    peer_prediction_noise: 0.3
    peer_prediction_dt: 0.2
    peer_prediction_risk: 0.05
