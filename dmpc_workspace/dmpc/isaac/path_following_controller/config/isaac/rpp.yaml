# Native Nav2 RPP plugin parameters for Isaac ground-truth odometry.
# MPC-native RPP launch scopes the template and adds mpc_execution.yaml.
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    enable_stamped_cmd_vel: false  # The Swerve controller accepts Twist.
    odom_topic: odom
    speed_limit_topic: speed_limit
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    publish_zero_velocity: true
    failure_tolerance: 0.0
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.005
      # Time-local MPC paths can be centimeters long; keep goal tolerance below
      # the minimum lookahead and resolve genuine stationary-turn headings.
      yaw_goal_tolerance: 0.002

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 1.5
      lookahead_dist: 0.04
      min_lookahead_dist: 0.04
      max_lookahead_dist: 0.12
      lookahead_time: 0.2
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.05
      # Each FollowPath goal is a rolling MPC window, not the final destination.
      # Final arrival/speed is owned by the timestamped MPC profile.
      approach_velocity_scaling_dist: 0.005
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      use_cost_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 0.5
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: world
      robot_base_frame: base_link  # Replaced with robot_a/base_link, etc.
      update_frequency: 20.0
      publish_frequency: 2.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.3
      track_unknown_space: false
      footprint: "[[0.35, 0.30], [0.35, -0.30], [-0.35, -0.30], [-0.35, 0.30]]"
      footprint_padding: 0.02
      # No static or sensor obstacle layer: this map has no obstacle input.
      # RPP therefore cannot detect the peer robot here. Peer avoidance must
      # come from the MPC, and physical contacts must be measured in Isaac.
      plugins: [inflation_layer]
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.15
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
